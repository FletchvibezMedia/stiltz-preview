name: Deploy Stiltz of Florida

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Mirror approved Version 15 release
        run: bash scripts/pull-release.sh release-source
      - name: Build production export
        run: node scripts/prepare-production.mjs release-source _site
      - name: Ensure custom domain file
        run: printf 'stiltzofflorida.com\n' > _site/CNAME
      - name: Verify production export
        run: |
          test -f _site/CNAME
          test -f _site/robots.txt
          test -f _site/sitemap.xml
          test ! -n "$(grep -Ril 'noindex, nofollow\|stiltz-florida-rescue-replica.carolina-qua-8173.chatgpt.site' _site --include='*.html' || true)"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
